apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patient-notes-api
  namespace: patient-notes
  labels:
    app.kubernetes.io/name: patient-notes-api
  annotations:
    # Assumes cert-manager with a ClusterIssuer named letsencrypt-prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - notes-api.example.com
      secretName: patient-notes-api-tls
  rules:
    - host: notes-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: patient-notes-api
                port:
                  name: http
