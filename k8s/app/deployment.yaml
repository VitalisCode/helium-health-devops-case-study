apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-notes-api
  namespace: patient-notes
  labels:
    app.kubernetes.io/name: patient-notes-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patient-notes-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patient-notes-api
    spec:
      serviceAccountName: patient-notes-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: patient-notes-api
      containers:
        - name: api
          
          image: patient-notes-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: patient-notes-api-config
            - secretRef:
                name: patient-notes-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi 
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              
              exec:
                command: ["sh", "-c", "sleep 10"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: patient-notes-api
  namespace: patient-notes
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: patient-notes-api
