
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: patient-notes
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patient-notes-api-secret
  namespace: patient-notes
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: patient-notes-api-secret # the Secret the Deployment reads
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: patient-notes-api/production/app # = terraform output secret_name
