apiVersion: v1
kind: Namespace
metadata:
  name: patient-notes
  labels:
    # Pod Security Admission: reject pods that violate the "restricted" profile.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patient-notes-api
  namespace: patient-notes
# The app never calls the Kubernetes API, so don't mount a token.
automountServiceAccountToken: false
