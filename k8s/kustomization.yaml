apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patient-notes
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Set the real registry and tag at deploy time, e.g.:
#   cd k8s && kustomize edit set image \
#     ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/patient-notes-api=<real-registry>/patient-notes-api:<git-sha>
images:
  - name: ACCOUNT_ID.dkr.ecr.eu-west-1.amazonaws.com/patient-notes-api
    newTag: latest
