# Cluster-level setup for EKS Auto Mode, managed by Argo CD (argocd/apps/platform.yaml).

# Auto Mode only enforces Kubernetes NetworkPolicy once this controller is switched on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: amazon-vpc-cni
  namespace: kube-system
data:
  enable-network-policy-controller: "true"
---
# ALB settings for every Ingress that uses this class (Auto Mode provisions the ALB itself).
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: alb
spec:
  scheme: internet-facing
  targetType: ip
  certificateARNs:
    # Terraform output acm_certificate_arn (terraform/service).
    - arn:aws:acm:eu-west-1:ACCOUNT_ID:certificate/REPLACE_ME
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: alb
